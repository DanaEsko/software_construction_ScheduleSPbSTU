# CI: static analysis and unit tests on every push and pull request
name: Lint and test

on:
  push:                    # every push to any branch
  pull_request:
    branches: [main]       # pull requests targeting main

permissions:
  contents: read           # least privilege: the workflow only reads the repo

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod   # Go version is taken from go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15                    # pinned linter version = same as local
          working-directory: backend

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Run tests
        working-directory: backend
        run: go test ./...